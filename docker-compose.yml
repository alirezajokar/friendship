# Dev stack.  Quick start:
#   cp .env.example .env         # optional — sane defaults are baked in below
#   docker compose up --build    # db + migrate + api + worker + web
# API  -> http://localhost:8000  (docs at /docs)
# Web  -> http://localhost:5173
# OTP codes are printed in the api logs:  docker compose logs -f api | grep SMS

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-friendship}:${POSTGRES_PASSWORD:-friendship}@db:5432/${POSTGRES_DB:-friendship}
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friendship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-friendship}
      POSTGRES_DB: ${POSTGRES_DB:-friendship}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-friendship}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: brings the schema up to date, then exits. api/worker wait for it.
  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
