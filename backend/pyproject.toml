[project]
name = "friendship-backend"
version = "0.1.0"
description = "Friendship app API — FastAPI backend"
requires-python = ">=3.12"
license = "MIT"  # full text at repository root: ../LICENSE
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "phonenumbers>=8.13",
    "persiantools>=5.1",
    "apscheduler>=3.10",
    "pywebpush>=2.0",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
